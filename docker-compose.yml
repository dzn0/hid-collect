# hid-driver-triage — minimal collector image.
#
#   docker compose build
#   docker compose run --rm collect           # list collectors
#   docker compose run --rm msupdate-catalog  # sweep the MS Update Catalog (primary, WHQL)
#   docker compose run --rm vendor-catalog    # sweep the Dell/HP OEM driver catalogs
#   docker compose run --rm snappy-driver     # fetch SDI input driverpacks via torrent
#
# Tune vendor-catalog (see pipeline/collectors/vendor_catalog.py):
#   PDT_VC_SOURCES=dell,hp                     (which OEM catalogs to crawl)
#   PDT_VC_JOBS=8 / PDT_VC_MAX_PACKS=0         (download workers; 0 = unlimited)
#   PDT_VC_MAX_MB=300                          (per-package size cap)
#   PDT_VC_REFRESH=1 / PDT_VC_REFRESH_DISCOVERY=1
#
# Tune snappy-driver (see pipeline/collectors/snappy_driver.py; aria2 torrent,
# Docker-only):
#   PDT_SDI_CATEGORIES=touchpad                (DP_* families to select)
#   PDT_SDI_BT_TIMEOUT=300                     (abort a stalled swarm, seconds)
#   PDT_SDI_MAX_PACKS=0                        (0 = all selected packs)
#   PDT_SDI_REFRESH=1 / PDT_SDI_REFRESH_DISCOVERY=1
#
# Tune msupdate-catalog (see pipeline/collectors/msupdate_catalog.py):
#   PDT_MSC_QUERIES="mouse;keyboard;..."      (; separated; default curated HID bank)
#   PDT_MSC_JOBS=8 / PDT_MSC_CRAWL_JOBS=12    (download / search+resolve workers)
#   PDT_MSC_MAX_PACKS=0 / PDT_MSC_MAX_MB=100  (0 = unlimited; per-.cab size cap)
#   PDT_MSC_MAX_PAGES=40                      (pages/query; catalog caps at 40×25=1000)
#   PDT_MSC_REFRESH=1 / PDT_MSC_REFRESH_DISCOVERY=1
#
# pipeline_out/ is bind-mounted so the content-addressed store, the resume
# ledger (processed.jsonl) and the discovery cache survive rebuilds.

x-hc-common: &hc-common
  image: hid-driver-triage:latest
  build: .
  volumes:
    - ./pipeline_out:/work/pipeline_out
    # Overlay the Python package from the host so edits don't need a rebuild.
    - ./pipeline:/work/pipeline

services:
  collect:
    <<: *hc-common
    command: ["pipeline.collect", "--list"]

  msupdate-catalog:
    <<: *hc-common
    environment:
      PDT_MSC_JOBS: ${PDT_MSC_JOBS:-8}
      PDT_MSC_CRAWL_JOBS: ${PDT_MSC_CRAWL_JOBS:-12}
      PDT_MSC_MAX_PACKS: ${PDT_MSC_MAX_PACKS:-0}
      PDT_MSC_MAX_MB: ${PDT_MSC_MAX_MB:-100}
      PDT_MSC_MAX_PAGES: ${PDT_MSC_MAX_PAGES:-40}
      PDT_MSC_BROWSER_WORKERS: ${PDT_MSC_BROWSER_WORKERS:-6}
      PDT_MSC_REFRESH: ${PDT_MSC_REFRESH:-0}
      PDT_MSC_REFRESH_DISCOVERY: ${PDT_MSC_REFRESH_DISCOVERY:-0}
      PDT_MSC_DISCOVERY_TTL_DAYS: ${PDT_MSC_DISCOVERY_TTL_DAYS:-7}
    tty: true
    command: ["pipeline.collect", "msupdate-catalog"]

  vendor-catalog:
    <<: *hc-common
    environment:
      PDT_VC_SOURCES: ${PDT_VC_SOURCES:-dell,hp}
      PDT_VC_JOBS: ${PDT_VC_JOBS:-8}
      PDT_VC_MAX_PACKS: ${PDT_VC_MAX_PACKS:-0}
      PDT_VC_MAX_MB: ${PDT_VC_MAX_MB:-300}
      PDT_VC_REFRESH: ${PDT_VC_REFRESH:-0}
      PDT_VC_REFRESH_DISCOVERY: ${PDT_VC_REFRESH_DISCOVERY:-0}
      PDT_VC_DISCOVERY_TTL_DAYS: ${PDT_VC_DISCOVERY_TTL_DAYS:-7}
    tty: true
    command: ["pipeline.collect", "vendor-catalog"]

  snappy-driver:
    <<: *hc-common
    environment:
      PDT_SDI_CATEGORIES: ${PDT_SDI_CATEGORIES:-touchpad}
      PDT_SDI_BT_TIMEOUT: ${PDT_SDI_BT_TIMEOUT:-300}
      PDT_SDI_SEED_TIME: ${PDT_SDI_SEED_TIME:-0}
      PDT_SDI_MAX_PACKS: ${PDT_SDI_MAX_PACKS:-0}
      PDT_SDI_REFRESH: ${PDT_SDI_REFRESH:-0}
      PDT_SDI_REFRESH_DISCOVERY: ${PDT_SDI_REFRESH_DISCOVERY:-0}
    tty: true
    command: ["pipeline.collect", "snappy-driver"]

  # ---- analysis image: Ghidra headless + the pipeline -------------------
  # Builds reports/<sha256>/ from a triaged binary already in the store.
  #   docker compose build ghidra
  #   docker compose run --rm report --pick            # best target + why
  #   docker compose run --rm report <sha-or-prefix>   # build the report
  ghidra:
    image: hid-driver-triage-ghidra:latest
    build:
      context: .
      dockerfile: Dockerfile.ghidra
      args:
        GHIDRA_VERSION: ${GHIDRA_VERSION:-12.1.4}
        GHIDRA_RELEASE: ${GHIDRA_RELEASE:-20260921}
        GHIDRA_SHA256: ${GHIDRA_SHA256:-ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db}
    volumes:
      - ./pipeline_out:/work/pipeline_out
      - ./pipeline:/work/pipeline
      - ./ghidra_scripts:/work/ghidra_scripts
      - ./reports:/work/reports
    tty: true
    command: ["pipeline.report", "--pick"]

  # Convenience alias so `docker compose run --rm report <args>` reads naturally
  # (entrypoint is pinned to the report module, so run-args append to it):
  #   docker compose run --rm report --pick
  #   docker compose run --rm report 83df54c9e75b
  report:
    extends:
      service: ghidra
    entrypoint: ["python3", "-m", "pipeline.report"]
    command: ["--pick"]
