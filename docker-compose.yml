# hid-collect — minimal collector image.
#
#   docker compose build
#   docker compose run --rm collect                       # list collectors
#   docker compose run --rm run                           # sweep touslesdrivers-input
#
# Tune the sweep via environment variables (see pipeline/collectors/touslesdrivers_input.py):
#   PDT_HID_CATEGORIES=10,11,17,19   (keyboard, mouse, tablet, gamepad)
#   PDT_HID_TYPES=1,4                (drivers, applications)
#   PDT_HID_MAX_BRANDS=0 / PDT_HID_MAX_PACKS=0           (0 = unlimited)
#   PDT_HID_JOBS=6 / PDT_HID_CRAWL_JOBS=8                (parallelism)
#   PDT_HID_MAX_MB=60                                    (per-package size cap)
#   PDT_HID_REFRESH=1                                    (ignore resume ledger)
#   PDT_HID_REFRESH_DISCOVERY=1                          (re-walk brand index)
#
# pipeline_out/ is bind-mounted so the content-addressed store, the resume
# ledger (processed.jsonl) and the discovery cache survive rebuilds.

x-hc-common: &hc-common
  image: hid-collect:latest
  build: .
  volumes:
    - ./pipeline_out:/work/pipeline_out
    # Per-driver disasm reports + the lean index land here (triage / disasm).
    - ./reports:/work/reports
    # Overlay the Python package from the host so edits don't need a rebuild.
    - ./pipeline:/work/pipeline

services:
  collect:
    <<: *hc-common
    command: ["pipeline.collect", "--list"]

  run:
    <<: *hc-common
    tty: true
    command: ["pipeline.collect", "touslesdrivers-input"]

  # Tight scope: only brands whose products are mouse/keyboard peripherals
  # (plus the motherboard-gaming vendors that ship bundled HID stacks). Drops
  # tablet/gamepad site categories entirely, then an explicit ALLOW keeps 81
  # brands / ~5100 pkgs out of the 7796-URL universe — the slice where strings
  # like MouseClassServiceCallback actually ship.
  #
  # Discovery cache and processed.jsonl are shared with `run` (same volume),
  # so switching between the two does not re-walk the site or re-download.
  # Microsoft Update Catalog — WHQL-signed HID / mouse / keyboard drivers.
  # Fast: ~60 narrow queries (one page each, 25 hits max), parallel search +
  # URL resolve + download. Shares the content-addressed store with every
  # other collector, so sha256-collisions across sources auto-dedupe.
  catalog:
    <<: *hc-common
    tty: true
    command: ["pipeline.collect", "msupdate-catalog"]

  # Deep catalog crawl: paginates up to PDT_MSC_MAX_PAGES=20 per query using a
  # headless Chromium (the catalog's ASP.NET postback blocks urllib). Needs
  # the Playwright+Chromium image built with `WITH_PLAYWRIGHT=1`:
  #   docker compose build --build-arg WITH_PLAYWRIGHT=1 catalog-deep
  # Then `docker compose run --rm catalog-deep` crawls ~60 queries × 20 pages
  # = up to ~30k UIDs instead of ~1500 — real "overnight" scope.
  catalog-deep:
    <<: *hc-common
    tty: true
    image: hid-collect:playwright
    build:
      context: .
      args:
        WITH_PLAYWRIGHT: "1"
    environment:
      PDT_MSC_MAX_PAGES: "20"
      PDT_MSC_BROWSER_WORKERS: "3"
    command: ["pipeline.collect", "msupdate-catalog"]

  # Policy gate over the collected corpus. Dry run by default — prints what the
  # gates would drop (test-signed, non-x64, no device surface, …). Add --apply
  # to actually prune the store + index. See pipeline/triage.py for gates.
  #   docker compose run --rm triage                      # dry run, 'loadable'
  #   docker compose run --rm triage --target             # the net's (a)+(c) goal
  #   docker compose run --rm triage --require prod-cert --apply
  triage:
    <<: *hc-common
    # entrypoint fixed to the module so `run --rm triage --target` passes flags
    # straight through (compose run replaces `command`, but appends after entrypoint)
    entrypoint: ["python", "-m", "pipeline.triage"]
    command: []

  # Disassembly stage: Ghidra headless follows DriverEntry to decide mouse
  # injection (b) and user-reachable symlink (c). Heavy — needs the Ghidra image:
  #   docker compose build --build-arg WITH_GHIDRA=1 disasm
  #   docker compose run --rm disasm --limit 50
  # Runs only over triage 'target' candidates by default, appending kind:disasm
  # lines that fold onto the analysis records.
  disasm:
    <<: *hc-common
    tty: true
    image: hid-collect:ghidra
    build:
      context: .
      args:
        WITH_GHIDRA: "1"
    entrypoint: ["python", "-m", "pipeline.disasm"]
    command: []

  tight:
    <<: *hc-common
    tty: true
    environment:
      PDT_HID_CATEGORIES: "10,11"
      PDT_HID_BRAND_ALLOW: >-
        microsoft,logitech,razer,steelseries,corsair,hyperx,roccat,cherry,
        wooting,obins,mountain,akko,ducky,pulsar,mionix,endgame gear,zowie,
        kensington,dygma,monsgeek,melgeek,kemove,klim,drevo,tesoro,viper,
        havit,glorious,bloody,cougar,saitek,mad catz,gamdias,redragon,
        redthunder,lexip,lamzu,alienware,aorus,asus,cooler master,evga,
        g.skill,gigabyte,msi,nzxt,lian li,fnatic,durgod,qpad,ozone,hkg,
        coolkiller,yunzii,dareu,zelotes,a4tech,elecom,aula,endorfy,xanova,
        xtrfy,fox spirit,g4m3r,mojo,matrix,protoarc,rantopad,tmkb,perixx,
        fl.esports,sog,jelly comb,easars,empire gaming,art. lebedev,hyte,
        kfa2,be quiet!,adata,mushkin
    command: ["pipeline.collect", "touslesdrivers-input"]
